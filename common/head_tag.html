<script type="text/x-discourse-plugin" version="0.8">
  api.modifyClass('route:discovery.category', {
    pluginId: 'auto-alphabetical-sort',

    beforeModel(transition) {
      this._super(...arguments);

      // Extraction propre et robuste des paramètres de la catégorie via Ember
      const params = this.paramsFor('discovery.category');
      if (!params || !params.category_slug_path_with_id) return;

      const categoryPath = params.category_slug_path_with_id;
      const parts = categoryPath.split('/');
      const categoryId = parseInt(parts[parts.length - 1], 10);
      if (isNaN(categoryId)) return;

      // Récupération sécurisée des catégories configurées
      const allowedCategories = settings.categories_cible
        ? String(settings.categories_cible)
            .split('|')
            .map(id => parseInt(id, 10))
            .filter(id => !isNaN(id))
        : [];

      // Application de la redirection si la catégorie est dans la sélection
      if (allowedCategories.includes(categoryId)) {
        const queryParams = transition.to?.queryParams || {};

        if (!queryParams.order) {
          // Le RETURN est indispensable pour interrompre la transition en cours et stopper la boucle 429
          return this.transitionTo('discovery.category', categoryPath, {
            queryParams: Object.assign({}, queryParams, {
              order: 'title',
              ascending: true // Type booléen strict
            })
          });
        }
      }
    }
  });
</script>
