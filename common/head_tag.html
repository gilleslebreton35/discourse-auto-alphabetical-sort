<script type="text/x-discourse-plugin" version="0.8">
  api.registerConnectorClass('discovery-navigation-bar-above', 'alphabetical-sort-btn', {
    setupComponent(args, component) {
      const category = args.category;
      if (!category) {
        component.set('showSort', false);
        return;
      }

      // Récupération des slugs autorisés dans le composant
      const allowedCategories = String(settings.categories_cible || "")
        .split("|")
        .map(s => s.trim())
        .filter(Boolean);

      // Vérifie si le slug de la catégorie actuelle correspond
      const isAllowed = allowedCategories.includes(category.slug);
      component.set('showSort', isAllowed);

      if (isAllowed) {
        // Construit le lien direct vers le filtre natif A -> Z
        const filterUrl = `${Discourse.getURL("/filter")}?q=` + encodeURIComponent(`=category:${category.slug} order:title-asc`);
        component.set('sortUrl', filterUrl);
      }
    }
  });
</script>

<script type="text/x-handlebars" data-template-name="/connectors/discovery-navigation-bar-above/alphabetical-sort-btn">
  {{#if showSort}}
    <div class="alphabetical-sort-banner" style="margin: 10px 0; padding: 8px 12px; background: var(--highlight); border-radius: 4px; display: flex; align-items: center; justify-content: space-between;">
      <span>Cette catégorie est affichée par défaut avec un tri personnalisé.</span>
      <a href={{sortUrl}} class="btn btn-default btn-small" style="font-weight: bold;">
        {{d-icon "sort-alpha-down"}} Voir le tri A-Z
      </a>
    </div>
  {{/if}}
</script>
